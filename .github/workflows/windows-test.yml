name: Win真机测试

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows-full:
    runs-on: windows-latest
    name: Win真机 · setup+verify+rollback
    steps:
      - uses: actions/checkout@v4

      - name: 创建模拟布洛陀环境
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .github/scripts/setup-mc-env.ps1

      - name: 创建豆包办公配置根
        shell: powershell
        run: |
          $doubao = Join-Path $env:APPDATA "DoubaoWork\Default\.doubaowork\agent_mode\workspace"
          New-Item -ItemType Directory -Path $doubao -Force | Out-Null
          Write-Host "豆包办公配置根: $doubao"

      - name: 运行 setup.ps1
        shell: powershell
        run: |
          $env:MEMORY_CENTER = Join-Path $env:RUNNER_TEMP "buluotuo-mc"
          powershell -ExecutionPolicy Bypass -File setup.ps1
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 退出码 $LASTEXITCODE" }

      - name: 运行 verify.ps1
        shell: powershell
        run: |
          $env:MEMORY_CENTER = Join-Path $env:RUNNER_TEMP "buluotuo-mc"
          powershell -ExecutionPolicy Bypass -File verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "verify.ps1 退出码 $LASTEXITCODE" }

      - name: 运行 rollback.ps1 (自动确认)
        shell: powershell
        run: |
          $env:MEMORY_CENTER = Join-Path $env:RUNNER_TEMP "buluotuo-mc"
          "y" | powershell -ExecutionPolicy Bypass -File rollback.ps1
          if ($LASTEXITCODE -ne 0) { throw "rollback.ps1 退出码 $LASTEXITCODE" }

      - name: 验证回滚结果
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .github/scripts/verify-rollback.ps1

  macos-setup-verify:
    runs-on: macos-latest
    name: Mac真机 · setup+verify
    steps:
      - uses: actions/checkout@v4

      - name: 创建模拟布洛陀环境
        run: bash .github/scripts/setup-mc-env.sh

      - name: 创建豆包办公配置根
        run: |
          DOUBAO="$HOME/Library/Application Support/DoubaoWork/Default/.doubaowork/agent_mode/workspace"
          mkdir -p "$DOUBAO"
          echo "豆包办公配置根: $DOUBAO"

      - name: 运行 setup.sh
        run: |
          export MEMORY_CENTER="$RUNNER_TEMP/buluotuo-mc"
          bash setup.sh
          if [ $? -ne 0 ]; then echo "setup.sh 失败"; exit 1; fi

      - name: 运行 verify.sh
        run: |
          export MEMORY_CENTER="$RUNNER_TEMP/buluotuo-mc"
          bash verify.sh
          if [ $? -ne 0 ]; then echo "verify.sh 失败"; exit 1; fi
